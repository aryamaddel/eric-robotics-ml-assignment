[project]
name = "eric-nav-perception"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nncf>=3.4.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxslim>=0.1.98",
    "opencv-python>=5.0.0.93",
    "openvino>=2026.4.1",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navperc"]

[dependency-groups]
dev = [
    "modal>=1.6.1",
]
